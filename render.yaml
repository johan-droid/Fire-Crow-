services:
  - type: web
    name: firecrow-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free
    healthCheckPath: /health
    # PORT is intentionally NOT pinned here: Render injects the runtime port
    # into the container environment, and the Rust service reads it via the
    # `config` crate's prefix-less Environment source (backend/src/config.rs
    # `Settings::new`, `default_port() == 8000` fallback). A pinned value
    # would fight the platform's injection. Local development keeps the 8000
    # default via backend/.env.local / Dockerfile ENV.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: firecrow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Cross-origin authentication (FC-DEP-01): when frontend is on Vercel (*.vercel.app)
      # and backend is on Render (*.onrender.com), browsers require SameSite=none with Secure=true
      # for credentials: 'include' session cookies to be transmitted across origins.
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Scanner execution (FC-DEP-04): points Axum backend to Docker daemon / proxy
      # e.g., tcp://<host>:2375 (remote Docker engine, cloud VPS, or tunnel)
      - key: DOCKER_HOST
        sync: false
      # AI Executive narrative generation
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      # Optional Redis cache & rate limiting
      - key: REDIS_URL
        sync: false
      - key: WORKSPACE_DIR
        value: "/app"

databases:
  - name: firecrow-db
    databaseName: firecrow
    user: firecrow
    plan: free
    region: oregon
