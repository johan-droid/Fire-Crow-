services:
  - type: web
    name: firecrow-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free
    healthCheckPath: /health
    # PORT is intentionally NOT pinned here: Render injects the runtime port
    # into the container environment, and the Rust service reads it via the
    # `config` crate's prefix-less Environment source (backend/src/config.rs
    # `Settings::new`, `default_port() == 8000` fallback). A pinned value
    # would fight the platform's injection. Local development keeps the 8000
    # default via backend/.env.local / Dockerfile ENV.
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: firecrow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # F1: Render's ingress proxy addresses are not confirmed here (that
      # would require probing the live deployment, which is out of scope).
      # Leave unset/empty: requests are then keyed by TCP peer — coarse (one
      # shared bucket) but never spoofable. Once Render's proxy CIDRs are
      # confirmed from authoritative docs, set them here to restore
      # per-client rate limiting. Malformed values refuse to start.
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      # Cross-origin authentication (FC-DEP-01): when frontend is on Vercel (*.vercel.app)
      # and backend is on Render (*.onrender.com), browsers require SameSite=none with Secure=true
      # for credentials: 'include' session cookies to be transmitted across origins.
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Scanner execution backend. "container" (default) runs pinned scanner
      # images through a Docker daemon; "native" runs the pinned scanner
      # binaries directly as hardened subprocesses and needs NO daemon — this is
      # the path for Render free tier, which has no Docker-in-Docker. Native
      # mode is opt-in and reports reduced (process-level) isolation; see
      # docs/deployment/native-scanning.md. Leave unset for container mode.
      - key: SCANNER_EXECUTION_MODE
        sync: false
      # Scanner execution, CONTAINER MODE ONLY (FC-DEP-04): points the Axum
      # backend to a Docker daemon / proxy, e.g. tcp://<host>:2375 (remote
      # Docker engine, cloud VPS, or tunnel). Ignored in native mode.
      - key: DOCKER_HOST
        sync: false
      # Native-mode scanner binary locations (optional). When unset, each
      # scanner is looked up on PATH. Set these only if the binaries live
      # somewhere non-standard; a configured-but-missing path fails that
      # scanner closed (reported unavailable), never silently substituted.
      - key: GITLEAKS_BIN
        sync: false
      - key: OSV_SCANNER_BIN
        sync: false
      - key: SEMGREP_BIN
        sync: false
      # AI Executive narrative generation
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      # Optional Redis cache & rate limiting
      - key: REDIS_URL
        sync: false

databases:
  - name: firecrow-db
    databaseName: firecrow
    user: firecrow
    plan: free
    region: oregon
