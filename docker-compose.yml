version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: firecrow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: firecrow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: firecrow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrow -d firecrow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: firecrow-redis
    restart: unless-stopped
    command: "redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    # FC-OPS-01: the password is provided to the container so the healthcheck
    # can authenticate. `redis-cli ping` without credentials returns NOAUTH
    # (an error exit), so the previous check reported an authenticated server
    # as unhealthy forever.
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Least-privilege Docker API proxy (deny-by-default). Sole socket holder:
  # the backend talks to it over TCP and never sees the socket itself.
  # Pinned image (never :latest); see backend/src/services/sandbox.rs
  # enforce_execution_policy for the content-level gate the proxy cannot do
  # (it filters API categories, not request bodies).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: firecrow-docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LOG_LEVEL: warning
      # `docker run` (create/attach/start/wait) + image pull + `docker rm -f`
      # (kill/remove) need exactly these sections. PING/VERSION stay at their
      # harmless defaults for the client handshake. POST=1 is required: the
      # proxy denies every non-GET method unless it is set, so without it even
      # container creation is refused; per-section rules below still gate
      # which endpoints any POST/DELETE may reach. Everything else stays
      # denied by the proxy default: no exec into containers, no network or
      # volume management, no builds, no swarm/system access. Forbidden
      # operation *content* (privileged, host binds, arbitrary images) is
      # rejected in code by enforce_execution_policy before Docker is touched.
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      ALLOW_START: 1
      ALLOW_RESTARTS: 1
      EXEC: 0
      NETWORKS: 0
      VOLUMES: 0
      BUILD: 0
      SYSTEM: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      AUTH: 0
      NODES: 0
      PLUGINS: 0
      DISTRIBUTION: 0
      SESSION: 0
      COMMIT: 0
      INFO: 0
      GRPC: 0
      EVENTS: 0
    expose:
      # Internal only: reachable as docker-socket-proxy:2375, never published
      # to the host (no `ports:`). Never expose this port publicly.
      - "2375"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firecrow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    volumes:
      # Phase A (F1): the backend MUST NOT hold the daemon socket. Scanner
      # execution goes through the least-privilege proxy above (DOCKER_HOST);
      # re-adding a socket mount here re-opens host takeover on backend RCE
      # and fails the docker_host_boundary regression test.
      - firecrow_storage:/app/workspace/storage
    ports:
      - "8000:8000"
    # ZT-08: read-only rootfs. The backend writes only to the mounted volume
    # firecrow_storage at /app/workspace/storage (volume mounts stay writable
    # under read_only); /tmp gets a writable tmpfs below. Scanner containers
    # are launched via the docker-socket-proxy, so the backend process itself
    # needs no Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      DATABASE_URL: "postgres://firecrow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/firecrow"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
      # Phase A (F1): scanner execution via the least-privilege socket proxy,
      # never via a mounted socket. The backend restores only this variable
      # (validated tcp://host:port form) after clearing its environment.
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required - generate with: openssl rand -base64 48}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required - must differ from SECRET_KEY - generate with: openssl rand -base64 48}"
      FRONTEND_URL: "${FRONTEND_URL:-https://your-firecrow-app.vercel.app}"
      CORS_ORIGINS: "${CORS_ORIGINS:-https://your-firecrow-app.vercel.app}"
      PORT: 8000
      HOST: 0.0.0.0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-pro}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-firecrow-artifacts}
      # G1 (FC-ZT-SEC-001 §4): the OSV scanner rides the internal network
      # with no external route, so its proxy env must address the sidecar.
      # Default is the compose sidecar below; override for non-compose
      # deployments that provide their own filtering proxy. Unset/empty keeps
      # the fail-closed behavior (scan refuses to run without a proxy).
      OSV_EGRESS_PROXY: "${OSV_EGRESS_PROXY:-http://egress-proxy:3128}"

  # G1 (FC-ZT-SEC-001 §4): filtering forward-proxy sidecar. The SOLE
  # straddler: attached to `scanners-internal` (inbound from scanners) and
  # the default network (outbound to the package databases). Scanner
  # containers attach ONLY to `scanners-internal`, which has no external
  # route — a direct socket from a scanner has nowhere to go, with the proxy
  # running AND with it stopped. Proxy env vars on scanners are addressing,
  # not the boundary; this topology is.
  #
  # No `ports:` — the proxy is reachable only inside Docker networking, never
  # from the host. Read-only rootfs (writes nothing), no capabilities.
  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.egress-proxy
    container_name: firecrow-egress-proxy
    restart: unless-stopped
    networks:
      - scanners-internal
      - default
    environment:
      EGRESS_PROXY_PORT: 3128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    depends_on: []

volumes:
  postgres_data:
  firecrow_storage:

# G1 topology primitive. `internal: true` = no gateway, no NAT, no external
# route — containers attached ONLY here cannot leave Docker networking, full
# stop. `external: true` with a fixed `name:` keeps the name stable across
# compose project prefixes, which is what the backend's
# `--network=scanners-internal` argv requires (Docker resolves the exact
# network name, not a prefixed one).
#
# PROVISION (run once per host, before first `up`):
#   docker network create --driver bridge --internal --subnet 172.28.0.0/16 \
#     --name scanners-internal
networks:
  scanners-internal:
    name: scanners-internal
    external: true
