# Reproducible integration-test services.
#
# Brought up and torn down by scripts/test.sh. Ports are deliberately high and
# fixed so a developer and CI agree on the connection strings.
#
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL=postgres://firecrow_test:firecrow_test@127.0.0.1:55433/postgres
#   export TEST_REDIS_URL=redis://127.0.0.1:56480
#   cargo test
#
# These are throwaway test credentials for a local container that is not exposed
# to the network. Do not reuse them anywhere else.

services:
  postgres:
    image: postgres:16-alpine
    container_name: firecrow-test-pg
    environment:
      POSTGRES_USER: firecrow_test
      POSTGRES_PASSWORD: firecrow_test
      POSTGRES_DB: firecrow_test
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrow_test -d firecrow_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # Keep the test database entirely in memory so runs are fast and leave
      # nothing behind. `#[sqlx::test]` creates and drops a database per test.
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: firecrow-test-redis
    ports:
      - "127.0.0.1:56480:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
