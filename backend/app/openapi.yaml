        be\u2011forgotten).\n\nThe user record is **soft\u2011deleted**: PII fields\
        \ are cleared and the\naccount is marked inactive.  The row is kept for referential\
        \ integrity\n(audit jobs, reports, etc.) but contains no personally identifiable\
