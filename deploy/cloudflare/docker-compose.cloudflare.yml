version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: firecrow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: firecrow
      # security_p0_2: no committed default for a database credential.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: firecrow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrow -d firecrow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: firecrow-redis
    restart: unless-stopped
    # security_p0_2: no committed default for a cache credential.
    command: "redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: firecrow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://firecrow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/firecrow"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
      # security_p0_2: these had committed default values, so anyone with the
      # repo could forge a JWT for any user. They are also required to differ
      # (config.rs rejects identical keys), so the old defaults prevented the
      # backend from starting at all. `:?` makes compose fail with an actionable
      # message instead of silently using a public key.
      #
      # Generate both, and never reuse a value across environments:
      #   openssl rand -base64 48
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required - generate with: openssl rand -base64 48}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required - must differ from SECRET_KEY - generate with: openssl rand -base64 48}"
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-firecrow-artifacts}
      CF_TURNSTILE_SECRET_KEY: ${CF_TURNSTILE_SECRET_KEY:-}
      CF_TURNSTILE_SITE_KEY: ${CF_TURNSTILE_SITE_KEY:-}
      CF_TURNSTILE_ENABLED: ${CF_TURNSTILE_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 8000
      HOST: 0.0.0.0

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: firecrow-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  postgres_data:
