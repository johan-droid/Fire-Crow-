# Deploy the Fire Crow frontend to Cloudflare Pages.
#
# Why this exists
# ---------------
# The Cloudflare Git-integration build runs a dashboard-configured "Deploy
# command" that defaults to the Workers command `npx wrangler deploy`, which
# aborts on this Pages project with:
#   "It looks like you've run a Workers-specific command in a Pages project."
# That setting lives only in the Cloudflare dashboard (there is no repo-side
# override). This workflow instead builds the SPA here and uploads the static
# bundle with `wrangler pages deploy`, reusing the canonical `cf:deploy` script
# from package.json.
#
# Required repository secrets
# ---------------------------
#   Settings > Secrets and variables > Actions
#     CLOUDFLARE_API_TOKEN   - Account > Cloudflare Pages > Edit
#     CLOUDFLARE_ACCOUNT_ID  - Cloudflare dashboard > Account ID
#
# No secrets are printed; the token is passed only through the environment.

name: Deploy frontend (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two Pages deployments for the same ref at the same time. Deploys are
# not cancelled mid-flight so a partially uploaded deployment is never left
# behind.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Root install provides Wrangler (used by `npm run cf:deploy`).
      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # `cf:deploy` == `npx wrangler pages deploy frontend/dist --project-name=fire-crow`
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
