name: CI

# CI workflow for Fire Crow. Runs the mandatory release checks:
#   * backend: format, compile, unit tests, security suites
#   * docker-authz-plugin: format, compile, unit tests
#   * frontend: type check, unit tests, production build
#
# Database-backed integration suites require a running PostgreSQL and Redis;
# they are run separately via backend/scripts/test.sh against an isolated
# fixture and are intentionally not part of CI.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        run: cargo fmt --check
      - name: Compile (locked)
        run: cargo check --locked
      - name: Compile tests (locked)
        run: cargo check --locked --tests
      - name: Unit tests (no database)
        run: cargo test --lib --bins --locked
      - name: Docker host boundary suite (no database)
        run: cargo test --test docker_host_boundary --locked
      - name: Sandbox hardening suite (no database)
        run: cargo test --test sandbox_hardening --locked
      - name: OSV egress enforcement suite (no database)
        run: cargo test --test osv_egress_enforcement --locked
      - name: Config security suite (no database)
        run: cargo test --test config_security --locked
      - name: Security regression suite (no database)
        run: cargo test --test security_regressions --locked
      - name: Egress proxy binary suite (no database)
        run: cargo test --bin egress_proxy --locked

  docker-authz-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker-authz-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: docker-authz-plugin
      - name: Format check
        run: cargo fmt --check
      - name: Compile (locked)
        run: cargo check --locked
      - name: Compile tests (locked)
        run: cargo check --locked --tests
      - name: Unit + integration tests
        run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check + unit tests
        run: npm test
      - name: Production build
        run: npm run build

  # Compose configuration validation (no secrets required for -q check)
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: |
          printf 'POSTGRES_PASSWORD=fake\nREDIS_PASSWORD=fake\nSECRET_KEY=%s\nENCRYPTION_KEY=%s\n' "$(openssl rand -base64 48)" "$(openssl rand -base64 48)" > .env
          docker compose config -q
          rm -f .env
